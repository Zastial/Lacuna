services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: lacuna
      POSTGRES_PASSWORD: lacuna
      POSTGRES_DB: lacuna
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lacuna"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      DATABASE_URL: postgres://lacuna:lacuna@postgres:5432/lacuna?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      API_ADDR: ":8080"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  ingester:
    build:
      context: .
      dockerfile: Dockerfile.ingester
    environment:
      DATABASE_URL: postgres://lacuna:lacuna@postgres:5432/lacuna?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      INGEST_INTERVAL: 6h
      MIN_REFETCH_INTERVAL: 15m
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
